<!DOCTYPE html>
<html lang="{{ 'kk' if lang=='kz' else 'ru' }}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgrOS — {{ farmer.name if farmer else 'Чат' }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#E7ECE1;--surface:#FFFFFF;--forest:#14401E;--green:#2FA048;--tx:#12290F;--muted:#6B7A63;--bd:rgba(20,64,30,.10);--shadow:0 6px 18px rgba(20,64,30,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--tx);max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
svg{flex:none}
.top{display:flex;align-items:center;gap:11px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.back{color:var(--muted);display:flex;align-items:center}
.back svg{width:22px;height:22px}
.tavatar{width:40px;height:40px;border-radius:50%;background:#E6F5DC;color:var(--forest);display:flex;align-items:center;justify-content:center;font-weight:800}
.tavatar svg{width:20px;height:20px}
.top h1{font-size:1.05rem;color:var(--tx);font-weight:800}
.top .who-sub{font-size:.74rem;color:var(--green);font-weight:600}
.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:16px;min-height:320px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:.92rem;line-height:1.4;box-shadow:0 1px 2px rgba(20,64,30,.08)}
.msg-me{background:var(--forest);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg-them{background:var(--surface);color:var(--tx);align-self:flex-start;border-bottom-left-radius:5px}
.input-row{display:flex;gap:9px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--bd);align-items:center}
.input-row input{flex:1;background:#F1F4EE;border:1px solid var(--bd);border-radius:22px;padding:12px 16px;color:var(--tx);font-size:.92rem;outline:none}
.input-row button{width:46px;height:46px;border-radius:50%;background:var(--forest);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.input-row button svg{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:40px}
</style></head>
<body>
<div class="top">
  <a href="/agronomist/chat" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="tavatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
  <div>
    <h1>{{ farmer.name if farmer else '—' }}</h1>
    <div class="who-sub">{% if lang=='kz' %}желіде{% else %}в сети{% endif %}</div>
  </div>
</div>
<div class="messages" id="msgs">
  {% for m in messages %}
  <div class="msg {% if m.sender=='agronomist' %}msg-me{% else %}msg-them{% endif %}">{{ m.body }}</div>
  {% else %}<div class="empty">{% if lang=='kz' %}Хабарлама жоқ{% else %}Нет сообщений{% endif %}</div>{% endfor %}
</div>
<div class="input-row">
  <input id="inp" placeholder="{% if lang=='kz' %}Фермерге жауап...{% else %}Ответить фермеру...{% endif %}" onkeydown="if(event.key==='Enter')send()" autofocus>
  <button onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
</div>
<script>
var m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight;
function send(){
  var i=document.getElementById('inp'); var t=i.value.trim(); if(!t)return;
  var d=document.createElement('div'); d.className='msg msg-me'; d.textContent=t; m.appendChild(d); m.scrollTop=m.scrollHeight; i.value='';
  fetch('/agronomist/chat/{{ user_id }}/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})})
  .then(r=>r.json()).then(d=>{if(d.status!=='success')alert('Ошибка');});
}
</script>
</body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgrOS — {{ farmer.name if farmer else 'Чат' }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0C10;--surface:#141821;--surface2:#1B212C;--accent:#B7FF3C;--accent2:#6EE7A8;--tx:#F3F5F8;--muted:#868F9E;--bd:rgba(255,255,255,0.06)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--tx);max-width:760px;margin:0 auto;padding:24px 22px;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
svg{flex:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--bd);color:var(--muted);display:flex;align-items:center;justify-content:center}
.back svg{width:18px;height:18px}
.tavatar{width:38px;height:38px;border-radius:12px;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tavatar svg{width:18px;height:18px}
.top h1{font-size:1.15rem;color:var(--tx);font-weight:700;letter-spacing:-.01em}
.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:16px;min-height:320px}
.msg{max-width:78%;padding:11px 15px;border-radius:16px;font-size:.9rem;line-height:1.5}
.msg-me{background:rgba(183,255,60,.13);color:#E9FFC6;align-self:flex-end;border-bottom-right-radius:5px}
.msg-them{background:var(--surface2);color:var(--tx);align-self:flex-start;border-bottom-left-radius:5px}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;background:var(--surface2);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;color:var(--tx);font-size:.92rem;outline:none}
.input-row input:focus{border-color:var(--accent)}
.input-row button{background:var(--accent);color:#0A0C10;border:none;border-radius:16px;padding:0 18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:54px}
.input-row button svg{width:19px;height:19px}
.empty{text-align:center;color:var(--muted);padding:40px}
</style></head>
<body>
<div class="top">
  <a href="/agronomist/chat" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
  <div class="tavatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
  <h1>{{ farmer.name if farmer else '—' }}</h1>
</div>
<div class="messages" id="msgs">
  {% for m in messages %}
  <div class="msg {% if m.sender=='agronomist' %}msg-me{% else %}msg-them{% endif %}">{{ m.body }}</div>
  {% else %}<div class="empty">{% if lang=='kz' %}Хабарлама жоқ{% else %}Нет сообщений{% endif %}</div>{% endfor %}
</div>
<div class="input-row">
  <input id="inp" placeholder="{% if lang=='kz' %}Фермерге жауап...{% else %}Ответить фермеру...{% endif %}" onkeydown="if(event.key==='Enter')send()" autofocus>
  <button onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
</div>
<script>
var m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight;
function send(){
  var i=document.getElementById('inp'); var t=i.value.trim(); if(!t)return;
  var d=document.createElement('div'); d.className='msg msg-me'; d.textContent=t; m.appendChild(d); m.scrollTop=m.scrollHeight; i.value='';
  fetch('/agronomist/chat/{{ user_id }}/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})})
  .then(r=>r.json()).then(d=>{if(d.status!=='success')alert('Ошибка');});
}
</script>
</body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AgrOS {% block title %}{% endblock %}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #EDF1E7; color: #12290F; max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
.header { background: #EDF1E7; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(20,64,30,.08); }
.header-title { font-size: 1.15rem; font-weight: 800; color: #12290F; }
.header-icons { display: flex; gap: 10px; align-items: center; }
.header-icons a { color: #6B7A63; text-decoration: none; font-size: 1.2rem; }
.header-user { font-size: 0.8rem; color: #6B7A63; }

/* Language switcher */
.lang-switcher { display: flex; gap: 3px; align-items: center; background: #fff; border: 1px solid rgba(20,64,30,.1); border-radius: 10px; padding: 3px; }
.lang-btn { padding: 5px 9px; border-radius: 7px; font-size: 0.68rem; font-weight: 800; border: none; cursor: pointer; text-decoration: none; transition: all 0.15s; }
.lang-btn.active { background: #14401E; color: #fff; }
.lang-btn:not(.active) { background: transparent; color: #6B7A63; }
.lang-btn:not(.active):hover { color: #14401E; }

.content { padding: 16px; padding-bottom: 84px; }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(20,64,30,.1); display: flex; z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px; text-decoration: none; color: #6B7A63; font-size: 0.66rem; font-weight: 700; gap: 5px; transition: color 0.2s; }
.nav-item.active, .nav-item:hover { color: #14401E; }
.nav-item .icon { font-size: 1.3rem; }
.card { background: #FFFFFF; border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid rgba(20,64,30,.1); box-shadow: 0 6px 18px rgba(20,64,30,.07); }
.card-title { font-weight: 800; color: #12290F; margin-bottom: 8px; }
.badge { display: inline-block; padding: 3px 11px; border-radius: 20px; font-size: 0.72rem; font-weight: 800; }
.badge-green { background: #DCFCE7; color: #15803D; }
.badge-yellow { background: #FEF3C7; color: #B45309; }
.badge-blue { background: #DBEAFE; color: #1D4ED8; }
.badge-red { background: #FEE2E2; color: #B91C1C; }
.badge-gray { background: #E7ECE2; color: #3F5340; }
.btn { display: inline-block; padding: 14px 24px; border-radius: 14px; font-weight: 800; font-size: 0.92rem; border: none; cursor: pointer; text-decoration: none; text-align: center; transition: opacity 0.2s; }
.btn-primary { background: #14401E; color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-outline { background: transparent; color: #14401E; border: 1.5px solid #14401E; }
.btn-full { width: 100%; display: block; }
.section-title { font-size: 0.95rem; font-weight: 800; color: #12290F; margin: 20px 0 12px; }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 0.85rem; color: #6B7A63; font-weight: 600; margin-bottom: 6px; }
.input-group input, .input-group select, .input-group textarea { width: 100%; background: #F4F7F0; border: 1.5px solid rgba(20,64,30,.12); border-radius: 12px; padding: 12px 14px; color: #12290F; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
.input-group input:focus, .input-group select:focus { border-color: #2FA048; }
.info-box { background: #E6F5DC; border: 1px solid rgba(47,160,72,.2); border-radius: 12px; padding: 12px 16px; color: #1F5312; font-size: 0.88rem; font-weight: 600; margin-bottom: 16px; }
.warn-box { background: #FEF3C7; border: 1px solid rgba(180,83,9,.2); border-radius: 12px; padding: 12px 16px; color: #B45309; font-size: 0.88rem; font-weight: 600; margin-bottom: 16px; }
/* COMP-001 — Бонусный оверлей */
.bonus-overlay { display: none; position: fixed; inset: 0; background: #15803d; z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.bonus-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
.bonus-amount { font-size: 5rem; font-weight: 900; color: #fff; line-height: 1; }
.bonus-text { font-size: 1.3rem; color: #bbf7d0; margin-top: 12px; }
.bonus-sub { font-size: 0.9rem; color: #86efac; margin-top: 8px; }
.bonus-close { margin-top: 32px; background: #fff; color: #15803d; border: none; padding: 12px 32px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
{% block extra_styles %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}

<!-- COMP-001 -->
<div class="bonus-overlay" id="bonusOverlay">
  <div style="font-size:3rem">🌾</div>
  <div class="bonus-amount" id="bonusAmount">+0</div>
  <div class="bonus-text" id="bonusText">
    {% if lang == 'kz' %}Бонус есептелді!{% else %}Бонусы начислены!{% endif %}
  </div>
  <div class="bonus-sub">1 бонус = 1 ₸</div>
  <button class="bonus-close" onclick="closeBonusOverlay()">
    {% if lang == 'kz' %}Жақсы!{% else %}Отлично!{% endif %}
  </button>
</div>

<script>
function showBonus(amount) {
  document.getElementById('bonusAmount').textContent = '+' + amount;
  document.getElementById('bonusOverlay').classList.add('show');
  setTimeout(() => closeBonusOverlay(), 3000);
}
function closeBonusOverlay() {
  document.getElementById('bonusOverlay').classList.remove('show');
}
// Авто-показ бонуса из URL
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('bonus')) { showBonus(urlParams.get('bonus')); }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
